<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Xaerisoft...</title>
    <style>
        body { background: #050308; color: #b08aff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }
        .loader { font-size: 20px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="loader">Memuat Xaerisoft...</div>
    <script>
        // Logika Routing Xaerisoft
        const path = window.location.pathname;
        
        // 1. Secara default, arahkan ke file Home
        // WAJIB ADA GARIS MIRING (/) DI DEPAN NAMA FILE
        let targetPayload = '/payload_home.txt'; 
        
        // 2. Jika URL mengandung kata "tools" atau "dashboard", arahkan ke file Tools
        if (path.includes('tools') || path.includes('dashboard')) {
            targetPayload = '/payload_tools.txt'; 
        }

        // 3. Eksekusi pemanggilan file
        fetch(targetPayload)
            .then(response => {
                if (!response.ok) throw new Error('Gagal memuat');
                return response.text();
            })
            .then(html => {
                // Tampilkan isi file payload
                document.open();
                document.write(html);
                document.close();
            })
            .catch(err => {
                document.body.innerHTML = '<h1></h1><p>Memuat</p>';
            });
    </script>
</body>
</html>
