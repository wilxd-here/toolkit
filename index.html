<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Xaerisoft...</title>
    <style>
        body { background: #050308; color: #b08aff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }
        .loader { font-size: 20px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="loader">Memuat Xaerisoft...</div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const go = urlParams.get('go');
        
        // Default ke Home (file sekarang ada di dalam folder 'pages')
        let targetPayload = 'pages/payload_home.txt'; 
        
        // Cek parameter URL dan arahkan ke file yang tepat di dalam folder 'pages'
        if (go === 'tools' || go === 'dashboard') {
            targetPayload = 'pages/payload_tools.txt'; 
        } 
        else if (go === 'get-html') {
            targetPayload = 'pages/payload_gethtml.txt'; 
        }

        // Eksekusi pemanggilan file
        fetch(targetPayload)
            .then(response => {
                if (!response.ok) throw new Error('Gagal memuat');
                return response.text();
            })
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(err => {
                document.body.innerHTML = '<div style="text-align:center"><h1>Error</h1><p>File ' + targetPayload + ' tidak ditemukan.</p></div>';
            });
    </script>
</body>
</html>
