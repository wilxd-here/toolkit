<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Xaerisoft...</title>
    <style>
        body { background: #050308; color: #b08aff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }
        .loader { font-size: 20px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="loader">Memuat Xaerisoft...</div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const go = urlParams.get('go');
        
        // Default ke Home (langsung panggil nama file, tanpa folder)
        let targetPayload = 'payload_home.txt'; 
        
        if (go === 'tools' || go === 'dashboard') {
            targetPayload = 'payload_tools.txt'; 
        } 
        else if (go === 'get-html') {
            targetPayload = 'payload_gethtml.txt'; 
        }
        else if (go === 'ngl') {
            targetPayload = 'payload_ngl.txt';
        }
        else if (go === 'ttdownloader') {
            targetPayload = 'payload_ttdownloader.txt';
        }
        else if (go === 'spotify') {
            targetPayload = 'payload_spotify.txt';
        }
        else if (go === 'ig') {
            targetPayload = 'payload_ig.txt';
        }
        else if (go === 'insta') {
            targetPayload = 'payload_insta.txt';
        }
        else if (go === 'iqc') {
            targetPayload = 'payload_iqc.txt';
        }
        else if (go === 'legalosint') {
            targetPayload = 'payload_legalosint.txt';
        }
        else if (go === 'musicard') {
            targetPayload = 'payload_musicard.txt';
        }
        else if (go === 'quote') {
            targetPayload = 'payload_quote.txt';
        }
        else if (go === 'ttqc') {
            targetPayload = 'payload_ttqc.txt';
        }
        else if (go === 'wmp') {
            targetPayload = 'payload_wmp.txt';
        }
        else if (go === 'afinitas') {
            targetPayload = 'playload_afinitas.txt'; 
        }

        // Eksekusi pemanggilan file
        fetch(targetPayload)
            .then(response => {
                if (!response.ok) throw new Error('Gagal memuat');
                return response.text();
            })
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(err => {
                document.body.innerHTML = '<div style="text-align:center"><h1>Error</h1><p>File ' + targetPayload + ' tidak ditemukan.</p></div>';
            });
    </script>
</body>
</html>
